<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Metas · Campo</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campo">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0;background:#000}</style>
</head><body>


<style>
/* Layout: app de una columna con estética iOS oscura: título grande que se compacta en una barra con desenfoque, tarjetas destacadas con foto, listas agrupadas y hojas modales que suben desde abajo */
:root{
  color-scheme:dark;
  --bg:#000; --card:#1c1c1e; --card-hi:#2c2c2e; --inp:#2c2c2e; --sep:rgba(84,84,88,.6);
  --ink:#fff; --ink2:rgba(235,235,245,.6); --ink3:rgba(235,235,245,.3);
  --or:#ff9f0a; --or2:#ffd60a; --or-soft:rgba(255,159,10,.16); --green:#30d158; --red:#ff453a; --blue:#64d2ff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.9,.27,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .small{font-size:15px} .xs{font-size:13px}

/* barra superior compacta */
.navbar{position:fixed;top:0;left:0;right:0;z-index:25;padding-top:env(safe-area-inset-top,0px);background:rgba(10,10,12,.72);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border-bottom:.5px solid var(--sep);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.navbar.show{opacity:1;transform:none;pointer-events:auto}
.nb-in{max-width:640px;margin:0 auto;height:46px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nb-in span{text-align:center;font-weight:600;font-size:17px}
.top{padding-block:12px 2px}
.top-row{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.15}
.icon-btn{appearance:none;border:0;background:none;color:var(--or);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;justify-self:end}
.icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{opacity:.5}

main{display:flex;flex-direction:column;gap:30px;padding-block:16px calc(112px + env(safe-area-inset-bottom,0px))}
main.enter{animation:fadeUp .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.st{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--or)}
.link{appearance:none;border:0;background:none;color:var(--or);font-size:16px;cursor:pointer;padding:2px 0;white-space:nowrap}
.link:active{opacity:.5}
.quote{margin:0;border-left:3px solid var(--or);padding:1px 0 1px 12px;font-size:17px;color:var(--ink);line-height:1.4}

/* tarjetas y listas */
.card{background:var(--card);border-radius:16px;padding:16px}
.gl{background:var(--card);border-radius:14px;overflow:hidden}
.gr{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px;min-width:0;transition:background .15s}
.gr+.gr::before,.gr+.add-row::before{content:"";position:absolute;top:0;right:0;left:56px;border-top:.5px solid var(--sep)}
.gl.flat .gr+.gr::before{left:16px}
.gr:has(>.tap:active){background:var(--card-hi)}
.grow{flex:1;min-width:0}
.t{overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.tap{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;min-width:0}
.chev{flex:none;width:8px;height:14px;opacity:.35}
.chev path{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* casilla redonda */
.chk{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;flex:1;min-width:0}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:1.8px solid var(--ink3);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.chk:active .ck{transform:scale(.88)}
.chk[aria-checked="true"] .ck{background:var(--or);border-color:var(--or)}
.chk[aria-checked="true"] .ck::after{content:"";width:6.5px;height:12px;border:solid #000;border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
.chk[aria-checked="true"] .t{color:var(--ink2)}
.chk .t{transition:color .2s}
.pop .ck{animation:pop .38s var(--ease)}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.15)}100%{transform:scale(1)}}

.bar{height:6px;border-radius:99px;background:rgba(120,120,128,.28);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--or),var(--or2))}
.bar.g>i{background:var(--green)} .bar.over>i{background:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card-hi);color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.or{background:var(--or-soft);color:var(--or)} .pill.g{background:rgba(48,209,88,.16);color:var(--green)} .pill.red{background:rgba(255,69,58,.16);color:#ff6961}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pct{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--or)}

/* resumen tipo Fitness */
.hero{display:flex;align-items:center;gap:18px}
.legend{display:flex;flex-direction:column;gap:10px;min-width:0}
.lg-k{font-size:13px;font-weight:600;color:var(--ink2)}
.lg-v{font-family:var(--round);font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.lg-v small{font-size:16px;color:var(--ink2);font-weight:600}
.ring{flex:none}
.ring circle{fill:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.wd.today{color:var(--or)}
.mood{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mood button{appearance:none;border:0;aspect-ratio:1;border-radius:50%;background:var(--card);font-family:var(--round);font-size:20px;font-weight:700;color:var(--ink2);cursor:pointer;transition:transform .2s var(--ease),background .2s,color .2s;justify-self:center;width:100%;max-width:58px}
.mood button:active{transform:scale(.9)}
.mood button[aria-pressed="true"]{background:var(--or);color:#000;transform:scale(1.06)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{appearance:none;background:var(--card);border-radius:16px;padding:14px;min-width:0;text-align:left;border:0;display:flex;flex-direction:column;gap:4px;width:100%}
button.tile{cursor:pointer;transition:transform .2s var(--ease)}
button.tile:active{transform:scale(.97)}
.tile .k{font-size:13px;font-weight:600;color:var(--ink2)}
.tile .v{font-family:var(--round);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.1}

/* tarjetas de visión */
.vision{display:flex;flex-direction:column;gap:12px}
.feat{position:relative;display:block;width:100%;border:0;padding:0;border-radius:22px;overflow:hidden;cursor:pointer;background:radial-gradient(120% 90% at 100% 0%,rgba(255,159,10,.35),transparent 60%),linear-gradient(160deg,#2a1d10,#141414 70%);aspect-ratio:4/3;max-width:100%;text-align:left;transition:transform .25s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.feat:active{transform:scale(.975)}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 30%,transparent 45%,rgba(0,0,0,.82) 100%)}
.feat .meta-top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.feat .meta-bot{position:absolute;left:18px;right:18px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.feat .ft{font-size:27px;font-weight:800;line-height:1.08;letter-spacing:-.02em;color:#fff;text-wrap:balance;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.feat .fv{font-size:15px;color:rgba(255,255,255,.82);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.glass{background:rgba(30,30,30,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.glass.or{color:var(--or)}
.addfoto{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.addfoto svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.thumb{flex:none;width:40px;height:40px;border-radius:10px;overflow:hidden;background:var(--card-hi);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.fade{opacity:0;transition:opacity .35s ease} .fade.in{opacity:1}
img.broken{visibility:hidden}
.add-row{position:relative;appearance:none;border:0;background:none;color:var(--or);font-size:17px;cursor:pointer;padding:13px 16px;text-align:left;width:100%;display:flex;align-items:center;gap:12px}
.add-row:active{background:var(--card-hi)}
.add-row .plus{width:28px;height:28px;border-radius:50%;background:var(--or-soft);color:var(--or);display:grid;place-items:center;font-weight:600;font-size:20px;line-height:1}
details.fold>summary{list-style:none;cursor:pointer;color:var(--ink2);font-size:15px;padding:4px 2px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary{margin-bottom:8px}

/* botones */
.btn{appearance:none;border:0;border-radius:14px;background:var(--or);color:#000;font-weight:600;font-size:17px;padding:15px 16px;cursor:pointer;width:100%;transition:transform .18s var(--ease),opacity .18s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.sec{background:var(--card);color:var(--or)}
.btn.sm{width:auto;padding:8px 14px;font-size:15px;border-radius:99px;white-space:nowrap;flex:none}
.sh .num{white-space:nowrap;flex:none}
.btn.danger{background:var(--card);color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.qrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qbtn{appearance:none;border:0;flex:none;background:var(--card);color:var(--ink);border-radius:99px;padding:9px 15px;font-size:15px;cursor:pointer;white-space:nowrap;transition:transform .18s var(--ease)}
.qbtn:active{transform:scale(.95)}
.qbtn b{color:var(--or);font-weight:600}

/* dinero */
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month h2{margin:0;font-size:20px;font-weight:700}
.month button{appearance:none;border:0;background:var(--card);color:var(--or);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.month button svg{width:10px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.big-money{font-family:var(--round);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(120,120,128,.28);gap:2px}
.stack i{display:block;height:100%}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.leg div{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.ico{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico.in{background:rgba(48,209,88,.16);color:var(--green)} .ico.out{background:var(--card-hi);color:var(--ink2)} .ico.inv{background:var(--or-soft);color:var(--or)} .ico.sav{background:rgba(100,210,255,.15);color:var(--blue)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.amt.in{color:var(--green)}
.dayh{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;margin:6px 16px}
.note{font-size:14px;color:var(--ink2);line-height:1.4}
.empty{padding:26px 18px;text-align:center;color:var(--ink2);background:var(--card);border-radius:16px;font-size:15px}

/* formularios tipo Ajustes */
.form{display:flex;flex-direction:column;gap:22px}
.fg{background:var(--card);border-radius:12px;overflow:hidden}
.fg-h{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;margin:0 16px -14px}
.fg-f{font-size:13px;color:var(--ink2);margin:-14px 16px 0;line-height:1.35}
.fr{position:relative;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;transition:background .15s}
.fr+.fr::before,#pe-list>.fr:first-child::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
#pe-list>.fr:first-child::before{display:none}
#pe-list+.add-row::before,#fj-list+.add-row::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
#pe-list:empty+.add-row::before,#fj-list:empty+.add-row::before{display:none}
.fr:focus-within{background:rgba(255,255,255,.04)}
.fl{flex:none;width:118px;font-size:16px;color:var(--ink)}
.fr input,.fr select,.fr textarea{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:13px 0;text-align:right;text-align-last:right;font:inherit;font-size:16px;color:var(--ink2);outline:none}
.fr input:focus,.fr textarea:focus,.fr select:focus{color:var(--ink)}
.fr.col{flex-direction:column;align-items:stretch;gap:2px;padding:10px 16px}
.fr.col .fl{width:auto;font-size:13px;color:var(--ink2)}
.fr.col input,.fr.col textarea{text-align:left;text-align-last:left;padding:4px 0;color:var(--ink)}
.fr textarea{resize:none;line-height:1.4}
input,select,textarea{font:inherit;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.amount-in{display:flex;align-items:center;justify-content:center;gap:2px;padding:6px 0}
.amount-in span{font-family:var(--round);font-size:40px;font-weight:700;color:var(--ink2)}
.amount-in input{font-family:var(--round);font-size:48px;font-weight:700;background:none;border:0;outline:none;width:6.2ch;text-align:left;color:var(--ink);padding:0}
.pe-row{gap:2px}
.pe-row input{flex:1;text-align:left!important;text-align-last:left!important;color:var(--ink)!important}
.mini{appearance:none;border:0;background:none;color:var(--ink3);width:34px;height:40px;cursor:pointer;flex:none;display:grid;place-items:center;border-radius:8px}
.mini:active{background:var(--card-hi)}
.mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mini.del{color:var(--red)}
.days{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 12px}
.days button{appearance:none;border:0;width:34px;height:34px;border-radius:50%;background:var(--card-hi);color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.days button:active{transform:scale(.9)}
.days button[aria-pressed="true"]{background:var(--or);color:#000}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(118,118,128,.24);border-radius:10px;padding:2px;gap:2px}
.seg button{appearance:none;min-width:0;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .2s}
.seg button[aria-pressed="true"]{background:#636366;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.foto-pv{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--card);display:grid;place-items:center;color:var(--ink3);font-size:15px}
.foto-pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.calc-g .fr input{color:var(--or);font-weight:600}

/* hoja modal */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);transition:background .25s ease}
.sheet.enter{animation:dim .3s ease}
@keyframes dim{from{background:rgba(0,0,0,0)}}
.sheet.out{background:rgba(0,0,0,0)}
.panel{--card:#2c2c2e;--card-hi:#3a3a3c;--inp:#3a3a3c;background:#1c1c1e;width:100%;max-width:640px;height:calc(100% - 14px - env(safe-area-inset-top,0px));border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.enter .panel{animation:slideUp .42s var(--ease)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet.out .panel{transform:translateY(100%)!important;transition:transform .26s cubic-bezier(.4,0,1,1)!important}
.panel-top{touch-action:none;cursor:grab}
.grabber{width:38px;height:5px;border-radius:99px;background:rgba(235,235,245,.28);margin:7px auto 0}
.panel-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.sh-t{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tbtn{appearance:none;border:0;background:none;color:var(--or);font-size:17px;cursor:pointer;padding:6px 0;justify-self:start;white-space:nowrap}
.tbtn:active{opacity:.5}
.tbtn.r{justify-self:end;font-weight:600}
.panel-b{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:24px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel-b.swap{animation:fadeUp .28s var(--ease)}
.hero-img{position:relative;flex:none;margin:-8px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));aspect-ratio:4/3;max-height:340px;overflow:hidden;background:var(--card)}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-img .scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(28,28,30,.95) 100%)}
.hero-img .ht{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:16px;bottom:14px;font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.big-t{margin:0;font-size:28px;font-weight:800;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}

/* pestañas */

.tabs button{appearance:none;border:0;background:none;color:#8e8e93;font-size:10.5px;font-weight:600;padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;letter-spacing:0}
.tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.tabs button:active svg{transform:scale(.88)}
.tabs button[aria-current="page"]{color:var(--or)}
.tabs button[aria-current="page"] .fillable{fill:currentColor;fill-opacity:.22}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,0);background:rgba(44,44,46,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 18px;border-radius:99px;font-size:15px;font-weight:500;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .3s var(--ease)}
.toast .undo{appearance:none;border:0;background:none;color:var(--or);font-weight:700;font-size:15px;margin-left:14px;padding:4px 2px;cursor:pointer}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.96)}}
.banner{margin-top:8px;padding:12px 14px;border-radius:14px;background:rgba(255,69,58,.16);color:#ffd2cf;font-size:15px}
/* sincronización */
.sync{appearance:none;border:0;margin-top:8px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;max-width:100%;text-align:left}
.sync svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sync.off{background:var(--or-soft);color:var(--or)} .sync.up{background:rgba(100,210,255,.14);color:var(--blue)}
.sync:active{opacity:.6}
/* castillo */
.gr.done .t{color:var(--ink2)}
.ph{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ph-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 4px}
.ph-n{font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.ph-t{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:1px}
.ph-s{font-size:14px;color:var(--ink2);margin-top:2px}
.ph.now .ph-n{color:var(--or)}
.ph-m{font-size:14px;line-height:1.4;margin-top:8px;border-left:3px solid var(--or);padding-left:10px}
.ph-m b{color:var(--or);font-weight:600}
.ph.past{opacity:.75}
.val{font-size:15px;font-weight:600;color:var(--green);max-width:46%;text-align:right;overflow-wrap:anywhere}
.zones{display:grid;gap:10px}
.zone{appearance:none;border:0;width:100%;text-align:left;cursor:pointer;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:transform .2s var(--ease)}
.zone:active{transform:scale(.98)}
.zone-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zone-t{font-size:17px;font-weight:700}
.zone-n{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.zone-n div{background:var(--card-hi);border-radius:12px;padding:8px 12px}
.zone-n b{display:block;font-family:var(--round);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.zone-n span{font-size:12px;color:var(--ink2);font-weight:600}
.diag{display:block;width:100%;height:auto}
.diag text{font-family:var(--font);font-size:10.5px;fill:var(--ink2);font-weight:600}
.diag .lbl-or{fill:var(--or)} .diag .lbl-bl{fill:var(--blue)}
.step-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--or-soft);color:var(--or);display:grid;place-items:center;font-size:14px;font-weight:700}
.freq{font-size:14px;color:var(--ink2);text-align:right;max-width:48%}
@media (min-width:560px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}

.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

/* ===== plano ===== */
.pl-fig{padding:10px;max-width:520px;width:100%;align-self:center;box-sizing:border-box}
.pl-svg{display:block;width:100%;height:auto}
.pl-lb{font:600 11px -apple-system,system-ui,sans-serif}
.pl-m{cursor:pointer}.pl-m circle{fill:#1c1c1e;stroke:#e6e6e6;stroke-width:1.2}
.pl-m text{font:700 9.5px ui-monospace,Menlo,monospace;fill:#fff;text-anchor:middle}
.pl-m.on circle{fill:#fff}.pl-m.on text{fill:#000}
.pl-card{background:#1c1c1e;border:1px solid #3a3a3c;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pl-ch{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.pl-ch b{font:600 12px ui-monospace,Menlo,monospace;width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.pl-ch span{flex:1}
.pl-ch button{appearance:none;border:0;background:#2c2c2e;color:#e6e6e6;width:28px;height:28px;border-radius:50%;font-size:18px;cursor:pointer}
.pl-kv{display:flex;flex-direction:column;gap:1px}
.pl-kv span{font-size:12px;color:#8e8e93}.pl-kv b{font:600 15px ui-monospace,Menlo,monospace;color:#fff}.pl-kv em{font-style:normal;font-size:12px;color:#a3a3a3}
.pl-go{text-align:center;text-decoration:none;display:block}
.pl-tab{background:#1c1c1e;border-radius:14px;overflow:hidden}
.pl-tr{appearance:none;border:0;border-top:.5px solid rgba(84,84,88,.5);background:transparent;color:#e6e6e6;width:100%;display:grid;grid-template-columns:28px 1fr 1fr 1.3fr;gap:6px;padding:10px 12px;text-align:left;font:500 13px -apple-system,system-ui,sans-serif;cursor:pointer}
.pl-tr span:nth-child(2),.pl-tr span:nth-child(3){font-family:ui-monospace,Menlo,monospace}
.pl-tr.th{border-top:0;color:#8e8e93;font-size:12px;cursor:default}
.pl-tr:active{background:#2c2c2e}
.pl-ficha{background:#1c1c1e;border-radius:14px;padding:4px 14px}
.pl-ficha div{display:flex;flex-direction:column;gap:1px;padding:9px 0;border-top:.5px solid rgba(84,84,88,.5)}
.pl-ficha div:first-child{border-top:0}
.pl-ficha span{font-size:12px;color:#8e8e93}.pl-ficha b{font-size:15px;font-weight:500;color:#e6e6e6}
.pl-obs{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45;color:#c7c7cc}
.pl-obs b{color:#fff}
.pl-ico{display:grid;place-items:center;padding:0}

/* modo campo */
.campo-chip{appearance:none;border:0;margin:8px 8px 0 0;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink2)}
.campo-chip i{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.campo-chip.on{background:rgba(48,209,88,.16);color:#a6f0b8}.campo-chip.on i{background:var(--green)}
.campo-chip.on.pend{background:var(--or-soft);color:var(--or2)}.campo-chip.on.pend i{background:var(--or)}
.campo-chip[hidden]{display:none}
.cp-wrap{display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}
.cp-lead{font-size:16px;line-height:1.45;color:#d1d1d6;margin:4px 2px}
.cp-step{display:grid;grid-template-columns:30px 1fr;gap:12px;background:#1c1c1e;border-radius:16px;padding:14px}
.cp-n{width:30px;height:30px;border-radius:50%;background:var(--or);color:#000;font-weight:700;display:grid;place-items:center;font-size:15px}
.cp-c{display:flex;flex-direction:column;gap:10px;min-width:0}
.cp-c h3{margin:4px 0 0;font-size:17px;color:#fff}
.cp-c p{margin:0;font-size:15px;line-height:1.45;color:#aeaeb2}
.cp-c b{color:#fff;font-weight:600}
.cp-ic{display:inline-block;color:var(--blue)}
.cp-url{font:500 14px ui-monospace,Menlo,monospace;color:var(--blue);background:#2c2c2e;border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all;-webkit-user-select:all}
.cp-ta{width:100%;box-sizing:border-box;background:#2c2c2e;color:#fff;border:0;border-radius:12px;padding:10px 12px;font:13px/1.35 ui-monospace,Menlo,monospace;resize:vertical}
.cp-ta.out{color:#a6f0b8;max-height:110px}
.cp-row{display:grid;grid-template-columns:auto 1fr;gap:8px}.cp-row .btn.sec{width:auto;padding-left:18px;padding-right:18px}
.cp-note{font-size:13px;line-height:1.4;color:#8e8e93;margin:0 2px}
.cp-stat{border-radius:14px;padding:12px 14px;font-size:15px}
.cp-stat.ok{background:rgba(48,209,88,.14);color:#a6f0b8}.cp-stat.warn{background:var(--or-soft);color:var(--or2)}
.cp-stat b{color:#fff}
.cp-big{font-size:22px;font-weight:700;color:var(--or2)}
.cp-ov .btn[disabled]{opacity:.4}
.cp-main{font-size:19px;padding:18px 16px}
.cp-how{margin:0 4px;font-size:15px;line-height:1.45;color:#aeaeb2}.cp-how b{color:#fff}
.cp-msg{background:#1c1c1e;border-left:3px solid var(--green);border-radius:10px;padding:10px 12px;font-size:15px;color:#e6e6e6}
.cp-inst{background:#1c1c1e;border-radius:14px;padding:12px 14px;margin-top:10px}
.cp-inst summary{cursor:pointer;font-weight:600;color:var(--or);font-size:15px}
.cp-inst ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45;color:#c7c7cc}
.cp-inst li{display:flex;flex-direction:column;gap:8px}.cp-inst li{display:list-item}.cp-inst .cp-url,.cp-inst .btn{margin-top:8px}

</style>

  const PHASES = [
    { t: 0.0, name: "Acelera", txt: "La válvula de impulso está abierta. El agua baja por el tubo cada vez más rápido y sale por el asiento a la pileta." },

  const fmt = (v, d = 1) => v.toLocaleString("es-EC", { minimumFractionDigits: d, maximumFractionDigits: d });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (t) => t * t * (3 - 2 * t);

  /* ---------- modelo ---------- */
  const S = { H: 1.5, h: 10, Q: 60, L: 350 };
  function eff(H, h) { return clamp(0.8 - 0.12 * Math.log(h / H), 0.35, 0.75); }
  const DRIVE = [["¾\"", 7.6, "½\"", 0.019], ["1\"", 22.7, "½\"", 0.025], ["1½\"", 53, "¾\"", 0.038], ["2\"", 95, "1\"", 0.05], ["2½\"", 132, "1¼\"", 0.063], ["3\"", 227, "1½\"", 0.076]];
  function model() {
    const { H, h, Q, L } = S;
    const lifts = h > H * 1.05;
    const e = eff(H, h);
    const q = lifts ? (Q * e * H) / h : 0;
    const pick = [...DRIVE].reverse().find((d) => Q >= d[1]) || DRIVE[0];
    const D = pick[3];
    const Lmin = Math.max(5 * H, 100 * D), Lmax = 7 * H;
    const bpm = Math.round(clamp(30 + 14 * H, 30, 95));
    // Hazen-Williams, PEAD 1" (DI ≈ 26 mm), C = 140
    const qs = q / 60000, Di = 0.026;
    const hf = qs > 0 ? (10.67 * L * Math.pow(qs, 1.852)) / (Math.pow(140, 1.852) * Math.pow(Di, 4.87)) : 0;
    return { lifts, e, q, day: q * 1440, waste: Q - q, pick, Lmin, Lmax, bpm, hf, bar: (h + hf) / 10.2 };
  }

  /* ---------- ciclo ---------- */
  // t de 0 a 1 en un ciclo
  function cyc(t) {
    let open; // 1 = plato abajo (abierta), 0 = cerrada
    if (t < 0.52) open = 1;
    else if (t < 0.58) open = 1 - ease((t - 0.52) / 0.06);
    else if (t < 0.83) open = 0;
    else if (t < 0.89) open = ease((t - 0.83) / 0.06);
    else open = 1;
    let v; // velocidad del agua en el tubo de impulso
    if (t < 0.58) v = (1 - Math.exp(-t / 0.15)) / (1 - Math.exp(-0.58 / 0.15));
    else if (t < 0.72) v = 1 - (t - 0.58) / 0.14;
    else if (t < 0.85) v = -0.18 * Math.sin((Math.PI * (t - 0.72)) / 0.13);
    else v = 0;
    const del = t >= 0.59 && t < 0.72 ? Math.sin((Math.PI * (t - 0.59)) / 0.13) : 0; // válvula de entrega
    const snif = t >= 0.73 && t < 0.84 ? Math.sin((Math.PI * (t - 0.73)) / 0.11) : 0;
    let ph = 0;
    for (let i = PHASES.length - 1; i >= 0; i--) if (t >= PHASES[i].t) { ph = i; break; }
    return { open, v, del, snif, ph };

  // presión en el cuerpo (m de agua) para la gráfica
  function pres(t, H, h) {
    if (t < 0.52) return H * (1 - 0.75 * Math.pow((1 - Math.exp(-t / 0.15)) / (1 - Math.exp(-0.58 / 0.15)), 2));
    if (t < 0.58) return H * 0.25 + (h * 1.25 - H * 0.25) * ease((t - 0.52) / 0.06);
    if (t < 0.72) { const u = (t - 0.58) / 0.14; return h + h * 0.25 * Math.cos(u * Math.PI * 3) * (1 - u); }
    if (t < 0.84) { const u = (t - 0.72) / 0.12; return h * (1 - ease(Math.min(1, u * 2.2))) - (0.12 * h + 0.6) * Math.sin(Math.PI * u); }
    return H * ease((t - 0.84) / 0.16);
  }

    catch(e){x.sending=false;const c=e&&e.code;
      if(FATAL.includes(c)){OB.shift();saveQ();toast(errMsg(e));continue}
      offline=true;backoff=Math.min(60000,backoff?backoff*2:4000);retryT=setTimeout(flush,backoff);break}
  }
  flushing=false;paintSync();
  if(!OB.length&&hadPend){hadPend=false;if(offline===false&&document.getElementById('sync').dataset.shown==='1')toast('Listo: tus cambios ya están en la nube')}
}
const COLS=['largo','corto','habitos','movs','lotes','ctareas'],CFGK={'config/finanzas':'fin','config/placas':'pl','config/castillo':'cfg'};
function overlay(){
  const now=Date.now();RECENT=RECENT.filter(x=>now-x.done<20000);

    if(CFGK[x.path]){const k=CFGK[x.path];S[k]=x.op==='delete'?null:x.op==='set'?clone(x.data):{...(S[k]||{}),...clone(x.data)};return}
    if(col==='dias'){if(x.op==='delete')delete S.dias[id];else S.dias={...S.dias,[id]:{id,...(x.op==='update'?(S.dias[id]||{}):{}),...clone(x.data)}};return}
    if(!COLS.includes(col))return;

/* ================= cálculos ================= */
function habitsFor(d){const wd=d.getDay();return S.habitos.filter(h=>!Array.isArray(h.dias)||h.dias.includes(wd)).sort(byOrden)}
function dayPct(d){const hs=habitsFor(d);if(!hs.length)return null;const h=(S.dias[iso(d)]||{}).hechos||{};return hs.filter(x=>h[x.id]).length/hs.length}
function racha(){let n=0;const d=new Date();if(!(dayPct(d)>=0.8))d.setDate(d.getDate()-1);for(let i=0;i<90;i++){const p=dayPct(d);if(p===null){d.setDate(d.getDate()-1);continue}if(p>=0.8){n++;d.setDate(d.getDate()-1)}else break}return n}
function prog(c){if(c.estado==='hecha')return 1;const p=c.pasos||[];return p.length?p.filter(x=>x.hecho).length/p.length:0}
function cortosDe(lid){return S.corto.filter(c=>c.largoId===lid).sort(byOrden)}
function ctProg(){const a=S.ctareas;return a.length?a.filter(t=>t.hecho).length/a.length:0}
function ctFaseProg(n){const ts=S.ctareas.filter(t=>+t.fase===+n);return ts.length?ts.filter(t=>t.hecho).length/ts.length:0}
function progLargo(l){if(l.tipo==='castillo')return ctProg();const cs=cortosDe(l.id).filter(c=>c.estado!=='pausada');return cs.length?cs.reduce((a,c)=>a+prog(c),0)/cs.length:0}
function progGeneral(){const a=S.corto.filter(c=>c.estado!=='pausada').map(prog);if(S.largo.some(l=>l.tipo==='castillo')&&S.ctareas.length)a.push(ctProg());return a.length?a.reduce((s,x)=>s+x,0)/a.length:0}
function ahorrado(cat){return cat?S.movs.filter(m=>m.tipo==='ahorro'&&m.cat===cat).reduce((a,m)=>a+ +m.monto,0):0}
function fondo(){return (Number(F().fondoBase)||0)+ahorrado('Fondo de emergencia')-ahorrado('Retiro del fondo')}
function ahorroCats(){return [...new Set(['Fondo de emergencia','Retiro del fondo','Escritura Castillo',...S.largo.map(l=>l.ahorroCat).filter(Boolean),'Otro ahorro'])]}
function catsFor(t){return t==='ahorro'?ahorroCats():CATS[t]||[]}
function diasRest(s){if(!s)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((parseIso(s)-t)/864e5)}
function fechaPill(s,estado){if(!s)return '';const n=diasRest(s);if(estado==='hecha')return `<span class="pill">${fmtF(s)}</span>`;const cls=n<0?'red':n<=14?'or':'';const tx=n<0?`venció hace ${-n} d`:n===0?'vence hoy':`faltan ${n} d`;return `<span class="pill ${cls}">${fmtFc(s)} · ${tx}</span>`}
function mesKey(off){const b=new Date();const m=new Date(b.getFullYear(),b.getMonth()+off,1);return {key:m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'),label:MESL[m.getMonth()]+' '+m.getFullYear()}}
function saldo(){const hoy=iso(new Date());return S.movs.filter(m=>(m.fecha||'')<=hoy).reduce((a,m)=>a+(m.tipo==='ingreso'?+m.monto:m.tipo==='ahorro'&&m.cat==='Retiro del fondo'?+m.monto:-m.monto),0)}
function pagoEstado(p){const hoy=new Date();hoy.setHours(0,0,0,0);const gs=S.movs.filter(x=>x.tipo==='gasto'&&x.cat===p.cat);
  const ok=xs=>{const t=xs.reduce((a,x)=>a+ +x.monto,0);const m=[...xs].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''))[0];return {pagado:xs.length>0&&t>=+p.monto*0.95,m}};
  if(!p.dia){const k=mesKey(0).key;return {...ok(gs.filter(x=>(x.fecha||'').startsWith(k))),due:null}}
  let due=new Date(hoy.getFullYear(),hoy.getMonth(),p.dia);if(due<hoy)due=new Date(hoy.getFullYear(),hoy.getMonth()+1,p.dia);
  const ini=new Date(due);ini.setDate(ini.getDate()-31);return {...ok(gs.filter(x=>{const d=parseIso(x.fecha);return d>ini&&d<=due})),due}}
function resumenMes(key){const ms=S.movs.filter(m=>(m.fecha||'').startsWith(key));const sum=t=>ms.filter(m=>m.tipo===t).reduce((a,m)=>a+(t==='ahorro'&&m.cat==='Retiro del fondo'?-m.monto:+m.monto),0);const r={ms,ing:sum('ingreso'),gas:sum('gasto'),inv:sum('inversion'),aho:sum('ahorro')};r.queda=r.ing-r.gas-r.inv-r.aho;return r}
const bar=(p,cls='')=>`<div class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p*100)}"><i style="width:${Math.min(100,Math.max(0,p*100)).toFixed(1)}%"></i></div>`;
let gid=0;
function ring(p,size,stroke,colors){const r=(size-stroke)/2,c=2*Math.PI*r,id='g'+(++gid);const grad=Array.isArray(colors);return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${grad?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${colors[0]}"/><stop offset="1" stop-color="${colors[1]}"/></linearGradient></defs>`:''}<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${grad?colors[0]:colors}" stroke-opacity=".2" stroke-width="${stroke}"/>${p>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${grad?`url(#${id})`:colors}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c*Math.min(1,p)).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`:''}</svg>`}
function rings2(p1,p2,size=118){const s=14,gap=3;const r1=(size-s)/2,r2=r1-s-gap;const c1=2*Math.PI*r1,c2=2*Math.PI*r2;const m=size/2;
  const arc=(r,c,p,g)=>p>0?`<circle cx="${m}" cy="${m}" r="${r}" stroke="url(#${g})" stroke-width="${s}" stroke-linecap="round" stroke-dasharray="${(c*Math.min(1,p)).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${m} ${m})"/>`:'';
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs><linearGradient id="ra" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ffd60a"/></linearGradient><linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#a6f0b8"/></linearGradient></defs><circle cx="${m}" cy="${m}" r="${r1}" stroke="#ff9f0a" stroke-opacity=".2" stroke-width="${s}"/>${arc(r1,c1,p1,'ra')}<circle cx="${m}" cy="${m}" r="${r2}" stroke="#30d158" stroke-opacity=".2" stroke-width="${s}"/>${arc(r2,c2,p2,'rb')}</svg>`}

/* ---------- HOY ---------- */
function rHoy(){
  const hoy=new Date(),dd=S.dias[iso(hoy)]||{},h=dd.hechos||{};

  o+=`</section><section>${T('¿Cómo te sientes?',dd.animo?`<span class="small muted">${ANIMO[dd.animo-1]}</span>`:`<span class="xs muted">1 muy mal · 5 excelente</span>`)}<div class="mood" role="group" aria-label="Ánimo del 1 al 5">${ANIMO.map((t,i)=>`<button data-act="animo" data-v="${i+1}" aria-pressed="${dd.animo===i+1}" aria-label="${t}">${i+1}</button>`).join('')}</div></section>`;
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}

  o+=act.length?`<div class="gl">${act.map(({c,i})=>{const n=diasRest(c.fecha);return `<div class="gr"><button class="chk" role="checkbox" aria-checked="false" data-act="paso" data-id="${esc(c.id)}" data-i="${i}" aria-label="Completar: ${esc(c.pasos[i].t)}" style="flex:none"><span class="ck"></span></button><button class="tap" data-open="corto" data-id="${esc(c.id)}"><span class="grow"><span class="t">${esc(c.pasos[i].t)}</span><div class="sub">${esc(c.titulo)}</div></span>${c.fecha&&n<=14?`<span class="pill ${n<0?'red':'or'}">${n<0?'vencida':n===0?'hoy':n+' d'}</span>`:''}${CHEV}</button></div>`}).join('')}</div>`:ctNext.length?'':`<div class="empty">Todo al día. No hay pasos pendientes.</div>`;

/* ---------- DINERO ---------- */
function movRow(m){const cls={ingreso:'in',gasto:'out',inversion:'inv',ahorro:'sav'}[m.tipo]||'out';const sg=m.tipo==='ingreso'?'+':m.tipo==='ahorro'?'':'−';return `<div class="gr"><button class="tap" data-open="mov" data-id="${esc(m.id)}"><span class="ico ${cls}">${IC[cls]}</span><span class="grow"><span class="t">${esc(m.cat)}</span><div class="sub">${TIPO[m.tipo]||''}${m.nota?' · '+esc(m.nota):''}</div></span><span class="amt ${cls==='in'?'in':''}">${sg}${money(m.monto)}</span>${CHEV}</button></div>`}
function rDinero(){
  const f=F(),{key,label}=mesKey(mesOff),R=resumenMes(key);
  const ms=[...R.ms].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.creado||0)-(a.creado||0));
  const fo=fondo(),fm=+f.fondoMeta||0,tot=+f.letrasTotal||48,lr=+f.letrasRestantes||0;
  const pres=f.presupuesto||{};
  const cats=[...new Set([...Object.keys(pres).filter(k=>+pres[k]>0),...ms.filter(m=>m.tipo==='gasto').map(m=>m.cat)])];

}

function openSheet(k,id,o={}){
  SH={k,id,edit:!!o.edit||['tarea','zona','finca'].includes(k),from:o.from||null,largoId:o.largoId,sub:o.sub,preset:o.preset,fase:o.fase,tipo:o.tipo,foto:{nuevo:null,quitar:false},armed:false};
  document.documentElement.classList.add('lock');
  const already=!sheetEl.hidden&&!sheetEl.classList.contains('out');sheetEl.hidden=false;sheetEl.classList.remove('out');
  renderSheet(already?'swap':'enter');
}
function closeSheet(){
  if(SH&&SH.foto.nuevo&&assets)assets.delete(SH.foto.nuevo).catch(()=>{});
  const back=SH&&SH.from;SH=null;
  if(back){openSheet(back.k,back.id);return}
  sheetEl.classList.remove('enter');sheetEl.classList.add('out');
  setTimeout(()=>{if(!SH){sheetEl.hidden=true;sheetEl.classList.remove('out');sheetEl.innerHTML='';document.documentElement.classList.remove('lock')}},270);
}
function renderSheet(mode){
  if(!SH)return;
  const r=({corto:shCorto,largo:shLargo,mov:shMov,lote:shLote,ajustes:shAjustes,tarea:shTarea,zona:shZona,finca:shFinca})[SH.k]();
  if(!r){SH.from=null;closeSheet();return}
  const hd=`<button class="tbtn" data-sh="left">${r.left}</button><div class="sh-t" id="sh-t">${esc(r.title)}</div><button class="tbtn r" data-sh="right" ${r.right?'':'hidden'}>${r.right||''}</button>`;
  const panel=sheetEl.querySelector('.panel');
  gid=100;
  if(!panel||mode==='enter'){
    sheetEl.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="panel-top" id="sh-top"><div class="grabber"></div><div class="panel-h" id="sh-hd">${hd}</div></div><div class="panel-b" id="sh-b">${r.body}</div></div>`;
    sheetEl.classList.remove('enter');void sheetEl.offsetWidth;sheetEl.classList.add('enter');
    return;
  }
  const b=document.getElementById('sh-b'),st=b.scrollTop;
  document.getElementById('sh-hd').innerHTML=hd;b.innerHTML=r.body;
  if(mode==='swap'){b.scrollTop=0;b.classList.remove('swap');void b.offsetWidth;b.classList.add('swap')}else b.scrollTop=st;
}
(()=>{let y0=null,dy=0,pn=null;

  sheetEl.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);pn.style.transform=`translateY(${dy}px)`});

async function shrink(file){
  try{const url=URL.createObjectURL(file);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=1800,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));if(b)return b}catch(e){}
  if(/^image\/(jpeg|png|webp|gif)$/.test(file.type))return file;
  throw {code:'unsupported_type'};
}
function pickPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files&&i.files[0];if(f)cb(f)};i.click()}
async function upload(file){toast('Subiendo foto…');const b=await shrink(file);const r=await assets.upload(b,{type:b.type||'image/jpeg'});return r.id}

}

    toast(med&&valor?'Medición anotada':'Guardado');finishSave();return;
  }
  if(k==='zona'){
    const zs=clone(CT().zonas||[]),i=+SH.id;if(!zs[i])return;
    zs[i]={...zs[i],nombre:d.nombre.trim(),nivel:(d.nivel||'').trim(),cacao:num(d.cacao)||0,platano:num(d.platano)||0,huecos:num(d.huecos),confirmado:!!d.confirmado,riego:(d.riego||'').trim(),problemas:(d.problemas||'').trim(),notas:(d.notas||'').trim()};
    saveCfg({zonas:zs});toast('Zona guardada');finishSave();return;
  }
  if(k==='finca'){
    const cur=CT().foto,fin=fotoFinal(cur);
    saveCfg({nombre:d.nombre.trim(),area:(d.area||'').trim(),rio:(d.rio||'').trim(),faseActual:+d.faseActual||1,escrituraMeta:num(d.escrituraMeta)||0,foto:fin});dropOld(cur,fin);
    toast('Finca guardada');finishSave();return;
  }
  if(k==='ajustes'){
    const rows=[...f.querySelectorAll('#hb-list .hab-ed')];const keep=new Set();

      let hid=r.dataset.hid;const ref=hid?{id:hid}:newRef('habitos');hid=ref.id;keep.add(hid);const body={nombre,orden:ix+1};if(dias.length<7)body.dias=dias;
      const cur=S.habitos.find(h=>h.id===hid);if(!cur||cur.nombre!==body.nombre||cur.orden!==body.orden||JSON.stringify(cur.dias||null)!==JSON.stringify(body.dias||null))put('habitos/'+hid,'set',body)});
    S.habitos.filter(h=>!keep.has(h.id)).forEach(h=>put('habitos/'+h.id,'delete'));
    const pres={};f.querySelectorAll('[data-pres]').forEach(i=>{const n=num(i.value);if(n)pres[i.dataset.pres]=n});
    const fijos=[...f.querySelectorAll('#fj-list .fj')].map(r=>({tipo:r.querySelector('.fj-t').value,cat:r.querySelector('.fj-c').value.trim(),monto:num(r.querySelector('.fj-m').value)})).filter(x=>x.cat&&x.monto>0);
    saveFin({fondoBase:num(d.fondoBase)||0,fondoMeta:num(d.fondoMeta)||0,cuota:num(d.cuota)||0,letrasRestantes:Math.max(0,Math.round(num(d.letrasRestantes)||0)),letrasTotal:Math.max(1,Math.round(num(d.letrasTotal)||48)),sueldo:num(d.sueldo)||0,presupuesto:pres,fijos});
    toast('Ajustes guardados');finishSave();return;
  }
}

let unsubs=[],resubT=null;

function subscribeAll(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  const fail=e=>{if(e&&e.code==='revoked'){banner('Ya no tienes acceso a estos datos.');return}
    offline=true;paintSync();clearTimeout(resubT);resubT=setTimeout(subscribeAll,20000)};
  const got=()=>{overlay();saveCache();sched()};
  const sub=(name,col)=>unsubs.push(db.collection(col).onSnapshot(s=>{S[name]=s.docs.map(x=>({id:x.id,...clone(x.data())}));loaded.add(name);if(!s.metadata||!s.metadata.fromCache){if(offline&&!OB.length){offline=false;paintSync()}}got()},fail));
  COLS.forEach(n=>sub(n,n));
  Object.entries(CFGK).forEach(([p,k])=>unsubs.push(db.doc(p).onSnapshot(x=>{S[k]=x.exists?clone(x.data()):null;got()},fail)));
  const desde=new Date();desde.setDate(desde.getDate()-95);
  unsubs.push(db.collection('dias').where('fecha','>=',iso(desde)).onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]={id:x.id,...clone(x.data())});S.dias=m;got()},fail));
}

/* ===== Conteo de matas por zona (pantalla completa) ===== */
const CNT = (() => {
  const CATS = [
    { k: "p", name: "Produciendo", col: "#30d158", short: "Mazorcas medianas o grandes", long: "Tiene mazorcas de más de un palmo, o ya le has cosechado. Tronco grueso y copa formada.", calc: "Cuenta entera" },
    { k: "e", name: "Entrando a producir", col: "#ff9f0a", short: "Flores o chireles, sin mazorcas grandes", long: "Tiene flores (blancas o rosadas, pequeñitas, saliendo del tronco en «cojines» abultados) o chireles del tamaño de un dedo. Es normal que muchos chireles se sequen solos.", calc: "Cuenta como media" },
    { k: "c", name: "Creciendo", col: "#64d2ff", short: "Sin flores ni mazorcas", long: "Mata joven, tronco delgado, todavía baja. Las injertas florecen entre los 14 y 24 meses.", calc: "Aún no cuenta" },
    { k: "d", name: "Enferma o débil", col: "#ff453a", short: "Amarilla, ramas secas, mazorcas negras", long: "Hojas amarillas, ramas secas, mazorcas negras o podridas (monilia, mazorca negra) o escoba de bruja. Se recupera con poda y sanidad, o se cambia.", calc: "Para recuperar o cambiar" },
    { k: "m", name: "Muerta o hueco", col: "#8e8e93", short: "No hay mata o está seca", long: "Cada hueco es un punto para sembrar una planta injerta nueva.", calc: "Punto para sembrar" },
  ];
  const POD_QQ = 800; // mazorcas sanas de CCN-51 por quintal seco (aprox.)
  const fmt = (v, d = 0) => (+v).toLocaleString("es-EC", { minimumFractionDigits: d, maximumFractionDigits: d });
  const blank = () => ({ p: 0, e: 0, c: 0, d: 0, m: 0, maz: 0 });
  let root, zone = 0, data = null, hist = [], saveT = null, info = null;
  const zonas = () => (CT().zonas || []).map((z, i) => z.nombre || "Zona " + (i + 1));
  function load() {
    const c = CT().conteo || {};
    const z = zonas().map((_, i) => ({ ...blank(), ...((c.z || {})[i] || {}) }));
    return { fecha: c.fecha || "", z };
  }
  const tot = (o) => o.p + o.e + o.c + o.d + o.m;
  function sum() { const s = blank(); data.z.forEach((z) => Object.keys(s).forEach((k) => (s[k] += +z[k] || 0))); return s; }
  function persist(now) {
    clearTimeout(saveT);
    const go = () => {
      const conteo = { fecha: data.fecha, z: Object.fromEntries(data.z.map((z, i) => [i, z])) };
      S.cfg = { ...CT(), conteo };
      put("config/castillo", "set", S.cfg);
    };
    if (now) go(); else saveT = setTimeout(go, 1200);
  }
  function bump(k, n) {
    const z = data.z[zone];
    const v = Math.max(0, (+z[k] || 0) + n);
    if (v === z[k]) return;
    hist.push({ zone, k, prev: z[k] });
    if (hist.length > 200) hist.shift();
    z[k] = v;
    data.fecha = iso(new Date());
    try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
    paint(k);
    persist();
  }
  function undo() {
    const h = hist.pop();
    if (!h) { toast("No hay nada que deshacer"); return; }
    data.z[h.zone][h.k] = h.prev;
    if (zone !== h.zone) { zone = h.zone; draw(); } else paint(h.k);
    persist();
  }
  function estim(o) {
    const eq = o.p + 0.5 * o.e;
    return {
      eq,
      vivas: o.p + o.e + o.c + o.d,
      hoy: [(eq * 0.5) / 45.36, (eq * 1.0) / 45.36], // kg seco por mata al año, sin manejo
      bien: [(eq * 1.5) / 45.36, (eq * 2.5) / 45.36], // con buen manejo
      camino: o.maz / POD_QQ,
    };
  }
  function summaryHtml() {
    const all = zone === "t", o = all ? sum() : data.z[zone], E = estim(o), n = tot(o);
    const bar = CATS.map((c) => (n ? `<i style="width:${((o[c.k] / n) * 100).toFixed(1)}%;background:${c.col}"></i>` : "")).join("");
    return `<div class="cnt-bar">${bar || '<i style="width:100%;background:#2c2c2e"></i>'}</div>
      <div class="cnt-sum">
        <div class="hl"><span>Matas contadas${all ? " (toda la finca)" : ""}</span><b>${fmt(n)}</b><em>${fmt(E.vivas)} vivas · ${fmt(o.m)} ${o.m === 1 ? "hueco" : "huecos"} para sembrar</em></div>
        <div><span>Productoras equivalentes</span><b>${fmt(E.eq, E.eq % 1 ? 1 : 0)}</b><em>produciendo + la mitad de las que entran</em></div>
        <div><span>Cosecha en camino</span><b>${fmt(E.camino, 1)} qq</b><em>${fmt(o.maz)} mazorcas sanas · próximos 5–6 meses</em></div>
        <div><span>Al año, como está hoy</span><b>${fmt(E.hoy[0], 1)}–${fmt(E.hoy[1], 1)} qq</b><em>0,5 a 1 kg seco por mata</em></div>
        <div><span>Al año, con buen manejo</span><b>${fmt(E.bien[0], 1)}–${fmt(E.bien[1], 1)} qq</b><em>1,5 a 2,5 kg seco por mata</em></div>
      </div>`;
  }
  function catHtml(c) {
    const z = data.z[zone];
    return `<div class="cnt-cat${info === c.k ? " open" : ""}" data-k="${c.k}" style="--c:${c.col}">
      <button class="cnt-hit" data-cnt="plus" data-k="${c.k}" aria-label="Sumar una: ${c.name}">
        <span class="cnt-dot"></span>
        <span class="cnt-txt"><b>${c.name}</b><small>${c.short}</small></span>
        <span class="cnt-n" data-n="${c.k}">${fmt(z[c.k])}</span>
      </button>
      <div class="cnt-row"><button class="cnt-minus" data-cnt="minus" data-k="${c.k}" aria-label="Restar una">−</button><button class="cnt-info" data-cnt="info" data-k="${c.k}">${info === c.k ? "Ocultar" : "¿Cómo se ve?"}</button><span class="cnt-calc">${c.calc}</span></div>
      ${info === c.k ? `<p class="cnt-long">${c.long}</p>` : ""}
    </div>`;
  }
  function draw() {
    const names = zonas(), all = zone === "t";
    const tabs = names.map((n, i) => `<button data-cnt="zone" data-z="${i}" aria-pressed="${zone === i}">${esc(n)}<small>${fmt(tot(data.z[i]))}</small></button>`).join("") + `<button data-cnt="zone" data-z="t" aria-pressed="${all}">Total<small>${fmt(tot(sum()))}</small></button>`;
    const body = all
      ? `<div class="cnt-table"><div class="cnt-tr th"><span></span>${names.map((n) => `<span>${esc(n.replace("Zona ", "Z"))}</span>`).join("")}<span>Total</span></div>
          ${[...CATS, { k: "maz", name: "Mazorcas sanas", col: "#ffd60a" }].map((c) => `<div class="cnt-tr"><span><i style="background:${c.col}"></i>${c.name}</span>${data.z.map((z) => `<span>${fmt(z[c.k])}</span>`).join("")}<span><b>${fmt(sum()[c.k])}</b></span></div>`).join("")}</div>
         <button class="btn cnt-apply" data-cnt="apply">Guardar las matas vivas en Zonas</button>
         <p class="cnt-note">Pasa el número de matas vivas de cada zona a la sección Zonas y las marca como confirmadas.</p>`
      : `<p class="cnt-how">Toca la tarjeta por cada mata que veas. Si te equivocas, usa <b>−</b> o <b>Deshacer</b>.</p>
         <div class="cnt-cats">${CATS.map(catHtml).join("")}</div>
         <div class="cnt-maz"><div class="cnt-maz-h"><span><b>Mazorcas sanas</b><small>Medianas y grandes, en las matas que producen. Unas ${POD_QQ} hacen 1 quintal seco.</small></span><span class="cnt-n" data-n="maz">${fmt(data.z[zone].maz)}</span></div>
           <div class="cnt-maz-b"><button data-cnt="maz" data-v="-1">−1</button><button data-cnt="maz" data-v="1">+1</button><button data-cnt="maz" data-v="5">+5</button><button data-cnt="maz" data-v="10">+10</button></div></div>`;
    root.querySelector(".cnt-zones").innerHTML = tabs;
    root.querySelector(".cnt-main").innerHTML = body;
    root.querySelector(".cnt-res").innerHTML = summaryHtml();
    root.querySelector('[data-out="fecha"]').textContent = data.fecha ? "Último cambio: " + fmtFc(data.fecha) : "Sin contar todavía";
  }
  function paint(k) {
    if (zone === "t") return draw();
    const el = root.querySelector(`[data-n="${k}"]`);
    if (el) { el.textContent = fmt(data.z[zone][k]); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    root.querySelectorAll(".cnt-zones small").forEach((s, i) => (s.textContent = fmt(i < data.z.length ? tot(data.z[i]) : tot(sum()))));
    root.querySelector(".cnt-res").innerHTML = summaryHtml();
    root.querySelector('[data-out="fecha"]').textContent = "Último cambio: " + fmtFc(data.fecha);
  }
  function apply() {
    const zs = CT().zonas.map((z, i) => (data.z[i] && tot(data.z[i]) > 0 ? { ...z, cacao: estim(data.z[i]).vivas, confirmado: true } : z));
    const c = { ...CT(), zonas: zs, conteo: { fecha: data.fecha, z: Object.fromEntries(data.z.map((z, i) => [i, z])) } };
    S.cfg = c; put("config/castillo", "set", c); sched(true);
    toast("Zonas actualizadas con tu conteo");
  }
  function build() {
    root = document.createElement("div");
    root.className = "ram-ov cnt-ov";
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-label", "Conteo de matas");
    root.innerHTML = `<div class="ram-top"><button class="ram-x" data-cnt="close" aria-label="Cerrar">×</button><div class="ram-tt"><div class="ram-k">Castillo</div><div class="ram-t">Conteo de matas</div></div><button class="cnt-undo" data-cnt="undo" aria-label="Deshacer">↶</button></div>
      <div class="ram-body"><div class="cnt-zones" role="tablist"></div><div class="cnt-date" data-out="fecha"></div><div class="cnt-main"></div><h3 class="ram-h">Resultado</h3><div class="cnt-res"></div>
      <p class="cnt-note">Las cifras de producción son estimados: 0,5 a 1 kg de cacao seco por mata al año sin manejo y 1,5 a 2,5 kg con buen manejo (CCN-51). Se guarda solo mientras cuentas, también sin señal.</p></div>`;
    document.body.appendChild(root);
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-cnt]");
      if (!b) return;
      const a = b.dataset.cnt, k = b.dataset.k;
      if (a === "close") return close();
      if (a === "undo") return undo();
      if (a === "zone") { zone = b.dataset.z === "t" ? "t" : +b.dataset.z; info = null; draw(); root.querySelector(".ram-body").scrollTop = 0; return; }
      if (a === "plus") return bump(k, 1);
      if (a === "minus") return bump(k, -1);
      if (a === "maz") return bump("maz", +b.dataset.v);
      if (a === "info") { info = info === k ? null : k; draw(); return; }
      if (a === "apply") return apply();
    });
    root.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }
  function open() {
    if (!root) build();
    data = load(); hist = []; if (zone !== "t" && zone >= data.z.length) zone = 0;
    draw();
    root.hidden = false;
    document.documentElement.classList.add("ram-lock");
    requestAnimationFrame(() => root.classList.add("in"));
  }
  function close() {
    if (!root) return;
    persist(true);
    root.classList.remove("in");
    document.documentElement.classList.remove("ram-lock");
    setTimeout(() => { root.hidden = true; sched(true); }, 220);
  }
  // tarjeta de la pestaña Castillo
  function card() {
    const c = CT().conteo, zs = (CT().zonas || []).length;
    let line = "Toca para empezar a contar en el terreno.";
    if (c && c.z) {
      data = load();
      const s = sum(), E = estim(s);
      line = `${fmt(tot(s))} matas · ${fmt(s.p)} produciendo · ${fmt(s.e)} entrando · ${fmt(s.m)} huecos${c.fecha ? " · " + fmtFc(c.fecha) : ""}`;
    }
    return `<section>${T("Conteo de matas")}<button class="cnt-card" data-act="conteo"><span class="cnt-card-i">${CATS.map((x) => `<i style="background:${x.col}"></i>`).join("")}</span><span class="grow"><span class="t">Contar matas por zona</span><span class="sub">${line}</span></span><span class="ram-full">Abrir</span></button></section>`;
  }
  return { open, close, card };
})();

/* ===== Modo campo: copia instalable que funciona sin internet =====
   La app de Claude necesita internet para abrir. La copia de campo (GitHub Pages, en la pantalla de inicio)
   abre sin señal. Se ponen al día con un botón en cada app: lo que una copia, la otra lo pega. */
const CAMPO = (() => {
  const URL_CAMPO = "https://alejandro59guerrero-spec.github.io/Alejandroo/";
  const URL_APP = "https://claude.ai/artifact/2qciGbMouNhG982LEz6aPt";
  const K_IMP = "mm-imp-v1", K_DAT = "mm-campo-datos";
  let root = null, msg = "", manual = false;
  const n = () => OB.length;
  const nTx = (k) => (k === 1 ? "1 registro" : k + " registros");
  const h32 = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const keyOf = (x) => x.path + "|" + x.op + "|" + x.t + "|" + h32(JSON.stringify(x.data));

  async function pack(prefix, obj) {
    const raw = JSON.stringify(obj);
    try {
      if (typeof CompressionStream !== "function") throw 0;
      const st = new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"));
      const buf = new Uint8Array(await new Response(st).arrayBuffer());
      let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      return prefix + "Z" + btoa(s);
    } catch (e) { return prefix + "J" + btoa(unescape(encodeURIComponent(raw))); }
  }
  async function unpack(prefix, code) {
    code = (code || "").replace(/\s+/g, "");
    const i = code.indexOf(prefix);
    if (i < 0) return null;
    try {
      const kind = code[i + prefix.length], bin = atob(code.slice(i + prefix.length + 1));
      if (kind === "J") return JSON.parse(decodeURIComponent(escape(bin)));
      const bytes = new Uint8Array(bin.length); for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      return JSON.parse(await new Response(st).text());
    } catch (e) { return null; }
  }
  /* copiar: se arranca dentro del toque (Safari lo exige) con el texto como promesa */
  function copyNow(makeText) {
    const p = Promise.resolve().then(makeText);
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        return navigator.clipboard.write([new ClipboardItem({ "text/plain": p.then((t) => new Blob([t], { type: "text/plain" })) })]).then(() => p.then((t) => ({ ok: true, t })), () => p.then((t) => fallbackCopy(t)));
      }
    } catch (e) {}
    return p.then((t) => (navigator.clipboard ? navigator.clipboard.writeText(t).then(() => ({ ok: true, t }), () => fallbackCopy(t)) : fallbackCopy(t)));
  }
  function fallbackCopy(t) {
    try { const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); const ok = document.execCommand("copy"); ta.remove(); return { ok, t }; } catch (e) { return { ok: false, t }; }
  }
  async function readClip() { try { return await navigator.clipboard.readText(); } catch (e) { return null; } }
  const fecha = (t) => { if (!t) return ""; const d = new Date(t); return d.getDate() + " " + MES[d.getMonth()] + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

  /* ---------- qué hace cada app con lo que pega ---------- */
  async function takeIn(text) {
    if (IS_CAMPO) {
      const o = await unpack("MMC1", text);
      if (!o || !o.S) return false;
      const done = new Set(o.imp || []);
      const before = n();
      OB = OB.filter((x) => !done.has(keyOf(x))); saveQ();
      ls.set(LS_C, { t: o.t || Date.now(), S: o.S }); ls.set(K_DAT, { t: o.t || Date.now() });
      msg = before && !n() ? "Listo: Mis Metas ya tiene todo lo del campo." : n() ? `Datos al día. Aún quedan ${nTx(n())} por pasar.` : "Listo: datos al día.";
      setTimeout(() => location.reload(), 900);
      return true;
    }
    const o = await unpack("MMR1", text);
    if (!o) return false;
    const items = (o.items || []).filter((x) => x && x.path && x.op);
    const done = new Set(ls.get(K_IMP) || []); let k = 0;
    items.forEach((x) => { const id = keyOf(x); if (done.has(id)) return; put(x.path, x.op, x.data); done.add(id); k++; });
    ls.set(K_IMP, [...done].slice(-3000));
    sched(true);
    msg = k ? (k === 1 ? "Se guardó 1 registro del campo." : `Se guardaron ${k} registros del campo.`) : "Eso ya estaba guardado.";
    return true;
  }
  const mainCode = () => pack("MMC1", { t: Date.now(), imp: (ls.get(K_IMP) || []).slice(-3000), S: (({ largo, corto, habitos, movs, lotes, ctareas, fin, pl, cfg, dias }) => clone({ largo, corto, habitos, movs, lotes, ctareas, fin, pl, cfg, dias }))(S) });
  const campoCode = () => pack("MMR1", { t: Date.now(), items: OB.map(({ sending, ...x }) => x) });

  /* ---------- pantalla ---------- */
  function draw() {
    if (!root) return;
    const C = ls.get(LS_C);
    let o = "";
    if (IS_CAMPO) {
      o += `<div class="cp-stat ${!C ? "warn" : n() ? "warn" : "ok"}">${!C ? "Esta app aún no tiene tus datos." : n() ? (n() === 1 ? "<b>1 registro</b> guardado aquí, falta pasarlo a Mis Metas." : `<b>${n()} registros</b> guardados aquí, falta pasarlos a Mis Metas.`) : `Todo al día · datos del <b>${fecha((ls.get(K_DAT) || {}).t || C.t)}</b>`}</div>`;
      o += `<button class="btn cp-main" data-cp="go">${n() ? "Pasar a Mis Metas" : "Traer mis datos"}</button>`;
      o += `<p class="cp-how">${n() ? "Se copian tus registros y se abre Mis Metas: ahí toca <b>Sincronizar con el campo</b>. Luego vuelve aquí y toca <b>Traer mis datos</b>." : "Primero, en Mis Metas toca <b>Sincronizar con el campo</b>. Luego vuelve aquí y toca este botón."}</p>`;
      if (n()) o += `<button class="btn sec" data-cp="pull">Traer mis datos</button>`;
    } else {
      o += `<div class="cp-stat ok">Abre <b>Campo</b> en el terreno: registra sin señal. Al volver, un botón en cada app y listo.</div>`;
      o += `<button class="btn cp-main" data-cp="go">Sincronizar con el campo</button>`;
      o += `<p class="cp-how">Guarda lo que hayas copiado en Campo y deja tus datos listos para llevar. Luego abre <b>Campo</b> y toca <b>Traer mis datos</b>.</p>`;
    }
    if (msg) o += `<div class="cp-msg">${esc(msg)}</div>`;
    if (manual) o += `<textarea class="cp-ta" id="cp-in" rows="3" placeholder="Mantén presionado aquí y elige Pegar" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>`;
    o += `<details class="cp-inst"${!IS_CAMPO && !ls.get("mm-campo-visto") ? " open" : ""}><summary>${IS_CAMPO ? "Ayuda" : "Instalar la app Campo (una sola vez)"}</summary>
      <ol><li>Abre este enlace en <b>Safari</b>:<div class="cp-url">${esc(URL_CAMPO)}</div><button class="btn sec" data-cp="url">Copiar enlace</button></li>
      <li>Toca <b>Compartir</b> (el cuadro con flecha) y luego <b>Agregar a pantalla de inicio</b>.</li>
      <li>Ábrela una vez con señal. Desde ahí funciona sin internet.</li></ol></details>`;
    root.querySelector(".ram-body").innerHTML = `<div class="cp-wrap">${o}</div>`;
    const ta = root.querySelector("#cp-in");
    if (ta) ta.addEventListener("input", async () => { if (await takeIn(ta.value)) { manual = false; afterIn(); } });
  }
  function afterIn() { paintSync(); chip(); draw(); toast(msg); }
  function build() {
    root = document.createElement("div");
    root.className = "ram-ov cp-ov"; root.hidden = true;
    root.setAttribute("role", "dialog"); root.setAttribute("aria-label", "Sincronizar con el campo");
    root.innerHTML = `<div class="ram-top"><button class="ram-x" data-cp="close" aria-label="Cerrar">×</button><div class="ram-tt"><div class="ram-k">${IS_CAMPO ? "Campo" : "Mis Metas"}</div><div class="ram-t">${IS_CAMPO ? "Sin internet" : "Campo sin internet"}</div></div><span></span></div><div class="ram-body"></div>`;
    document.body.appendChild(root);
    root.addEventListener("click", onTap);
    root.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }
  async function pull() {
    const t = await readClip();
    if (t && (await takeIn(t))) { manual = false; afterIn(); return true; }
    if (t !== null && t) { msg = IS_CAMPO ? "Lo copiado no es de Mis Metas. En Mis Metas toca Sincronizar con el campo." : ""; }
    return false;
  }
  async function onTap(e) {
    const b = e.target.closest("[data-cp]"); if (!b) return;
    const a = b.dataset.cp;
    if (a === "close") return close();
    if (a === "url") { const r = await copyNow(() => URL_CAMPO); toast(r.ok ? "Enlace copiado: pégalo en Safari" : "Mantén presionado el enlace para copiarlo"); return; }
    if (IS_CAMPO && a === "go" && n()) {
      const r = await copyNow(campoCode);
      msg = r.ok ? "Copiado. Ahora en Mis Metas toca Sincronizar con el campo." : "No se pudo copiar solo.";
      draw();
      if (r.ok) setTimeout(() => { location.href = URL_APP; }, 700);
      return;
    }
    if (IS_CAMPO && (a === "go" || a === "pull")) {
      msg = ""; if (!(await pull())) { manual = true; if (!msg) msg = "Pega aquí lo que copió Mis Metas:"; draw(); const ta = root.querySelector("#cp-in"); ta && ta.focus(); }
      return;
    }
    if (!IS_CAMPO && a === "go") {
      // 1) copiar los datos dentro del toque  2) leer lo que trajo Campo
      msg = "";
      const rp = readClip(); // los dos arrancan dentro del toque
      let got = false;
      const r = await copyNow(async () => { const t = await rp; if (t && t.includes("MMR1")) got = await takeIn(t); return mainCode(); });
      try { ls.set("mm-campo-visto", 1); } catch (er) {}
      msg = (got ? msg + " " : "") + (r.ok ? "Tus datos quedaron copiados: abre Campo y toca Traer mis datos." : "");
      if (!r.ok) { manual = false; showCode(r.t); }
      draw(); toast(got ? "Registros del campo guardados" : "Listo para el campo");
      return;
    }
  }
  function showCode(t) {
    msg = "Copia este código (mantén presionado → Seleccionar todo → Copiar) y pégalo en Campo:";
    setTimeout(() => { const w = root.querySelector(".cp-wrap"); if (!w) return; const ta = document.createElement("textarea"); ta.className = "cp-ta out"; ta.readOnly = true; ta.rows = 3; ta.value = t; w.insertBefore(ta, w.querySelector(".cp-inst")); }, 0);
  }
  function open() {
    if (!root) build();
    msg = ""; manual = false; draw(); root.hidden = false;
    document.documentElement.classList.add("ram-lock");
    requestAnimationFrame(() => root.classList.add("in"));
  }
  function close() {
    if (!root) return;
    root.classList.remove("in"); document.documentElement.classList.remove("ram-lock");
    setTimeout(() => { root.hidden = true; }, 220);
  }
  function chip() {
    const el = document.getElementById("campo"); if (!el) return;
    if (IS_CAMPO) {
      const C = ls.get(LS_C);
      el.className = "campo-chip on" + (n() || !C ? " pend" : "");
      el.innerHTML = `<i></i><span>${!C ? "Toca para traer tus datos" : n() ? nTx(n()) + " por pasar · Sin internet OK" : "Al día · funciona sin internet"}</span>`;
    } else {
      el.className = "campo-chip";
      el.innerHTML = `<i></i><span>Sincronizar con el campo</span>`;
    }
    el.hidden = false;
  }
  function boot() {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    chip();
    if (!ls.get(LS_C)) { render(); open(); }
  }
  document.addEventListener("click", (e) => { if (e.target.closest("#campo")) open(); });
  return { open, close, chip, boot };
})();
